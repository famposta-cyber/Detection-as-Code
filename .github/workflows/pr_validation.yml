name: Detection-as-Code CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-compile:
    name: Lint, Test and Compile Detections
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Schema Linter & Telemetry Unit Tests
        run: |
          pytest -v tests/test_rules.py

      - name: Compile Sigma Rules (Sentinel, Splunk, Elastic)
        run: |
          python scripts/compile_rules.py

      - name: Generate MITRE ATT&CK Navigator Layer
        run: |
          python scripts/generate_mitre_layer.py

      - name: Upload Compiled SIEM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-siem-queries
          path: dist/
          retention-days: 7

      - name: Upload ATT&CK Navigator Layer
        uses: actions/upload-artifact@v4
        with:
          name: mitre-attack-coverage
          path: mitre_coverage_layer.json
          retention-days: 14
